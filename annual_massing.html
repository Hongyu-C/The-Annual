<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Annual — Massing</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#EDE8E2; overflow:hidden; font-family:'DM Sans',sans-serif; cursor:none; }
canvas { display:block; position:fixed; top:0; left:0; }

#cursor {
  position:fixed; width:12px; height:12px; background:#1a1a1a;
  border-radius:50%; pointer-events:none; z-index:1000;
  transform:translate(-50%,-50%);
  transition: width .2s, height .2s, background .2s;
}
#cursor.hovering { width:28px; height:28px; background:rgba(26,26,26,.1); border:1.5px solid #1a1a1a; }
#cursor.grabbed  { width:18px; height:18px; background:#E8635A; }

#nav {
  position:fixed; top:0; left:0; right:0; z-index:200;
  display:flex; align-items:center; justify-content:space-between;
  padding:24px 40px; pointer-events:none;
}
.nav-logo { pointer-events:auto; }
.nav-logo-sub { font-family:'DM Sans',sans-serif; font-size:10px; font-weight:400; letter-spacing:.28em; text-transform:uppercase; color:#aaa; }
.nav-logo-main { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; color:#1a1a1a; margin-top:2px; }
.nav-links { pointer-events:auto; display:flex; gap:8px; }
.nav-link {
  background:rgba(255,255,255,.88); backdrop-filter:blur(8px);
  border:1px solid rgba(0,0,0,.08); padding:8px 18px;
  font-family:'DM Sans',sans-serif; font-size:10px; font-weight:500;
  letter-spacing:.12em; text-transform:uppercase; color:#666;
  cursor:pointer; border-radius:100px; text-decoration:none; transition:all .2s;
}
.nav-link.active { background:#1a1a1a; color:#fff; border-color:#1a1a1a; }
.nav-link:hover:not(.active) { background:#fff; color:#1a1a1a; }

#mode-toggle {
  position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
  z-index:200; display:flex;
  background:rgba(255,255,255,.92); backdrop-filter:blur(12px);
  border:1px solid rgba(0,0,0,.08); border-radius:100px; padding:4px;
}
.mode-btn {
  padding:10px 28px; font-family:'DM Sans',sans-serif; font-size:10px;
  font-weight:500; letter-spacing:.12em; text-transform:uppercase;
  color:#999; border:none; background:transparent; border-radius:100px;
  cursor:pointer; transition:all .3s;
}
.mode-btn.active { background:#1a1a1a; color:#fff; }

#hint {
  position:fixed; bottom:44px; right:40px; z-index:200;
  font-family:'DM Sans',sans-serif; font-size:10px;
  letter-spacing:.15em; text-transform:uppercase; color:#bbb;
  text-align:right; line-height:1.9; pointer-events:none;
}

#loading {
  position:fixed; inset:0; background:#EDE8E2; z-index:500;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
  transition:opacity .8s ease;
}
.loading-title { font-family:'Syne',sans-serif; font-size:28px; font-weight:800; color:#1a1a1a; }
.loading-bar-wrap { width:180px; height:2px; background:rgba(0,0,0,.08); border-radius:2px; overflow:hidden; }
.loading-bar { height:100%; background:#E8635A; border-radius:2px; width:0%; transition:width .2s; }
.loading-count { font-family:'DM Sans',sans-serif; font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:#aaa; }

#block-tag {
  position:fixed; z-index:300; background:#1a1a1a; color:#fff;
  font-family:'DM Sans',sans-serif; font-size:10px; letter-spacing:.12em;
  text-transform:uppercase; padding:5px 12px; border-radius:100px;
  pointer-events:none; opacity:0; transition:opacity .15s; white-space:nowrap;
}
</style>
</head>
<body>

<div id="cursor"></div>

<div id="loading">
  <div class="loading-title">The Annual</div>
  <div class="loading-bar-wrap"><div class="loading-bar" id="lbar"></div></div>
  <div class="loading-count" id="lcount">0 / 37</div>
</div>

<div id="nav">
  <div class="nav-logo">
    <div class="nav-logo-sub">The Annual</div>
    <div class="nav-logo-main">Massing</div>
  </div>
  <div class="nav-links">
    <a href="annual_program.html" class="nav-link">Program</a>
    <a href="annual_massing.html" class="nav-link active">Massing</a>
  </div>
</div>

<div id="mode-toggle">
  <button class="mode-btn active" id="btn-pile"    onclick="setMode('pile')">↳ Pile</button>
  <button class="mode-btn"        id="btn-explode" onclick="setMode('explode')">⊹ Blocks</button>
</div>

<div id="hint">drag · orbit<br>scroll · zoom</div>
<div id="block-tag"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const TOTAL    = 37;
const BASE_URL = 'https://raw.githubusercontent.com/Hongyu-C/The-Annual/main/models/';
const PALETTE  = [0xE8635A,0xF2C94C,0x9B8EC4,0xF4A7B9,0x5BC8C8,0xA8D8A8,0xF7956E,0xB8D4E8];

// ─── RENDERER ─────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xEDE8E2);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 2000);

// ─── LIGHTS ───────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const sun = new THREE.DirectionalLight(0xfff5e8, 0.8);
sun.position.set(15,25,18);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.near=0.5; sun.shadow.camera.far=500;
sun.shadow.camera.left=sun.shadow.camera.bottom=-60;
sun.shadow.camera.right=sun.shadow.camera.top=60;
sun.shadow.bias=-0.001;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xddeeff, 0.25);
fill.position.set(-10,8,-14);
scene.add(fill);

// ─── FLOOR ────────────────────────────────────────────────────────────────────
const floorMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(1000,1000),
  new THREE.ShadowMaterial({opacity:0.05})
);
floorMesh.rotation.x = -Math.PI/2;
floorMesh.receiveShadow = true;
scene.add(floorMesh);

const grid = new THREE.GridHelper(200,60,0xcccccc,0xdddddd);
grid.material.opacity=0.2; grid.material.transparent=true;
scene.add(grid);

// ─── OBJ PARSER ───────────────────────────────────────────────────────────────
// Rhino Z-up → Three Y-up: threeX=rhinoX, threeY=rhinoZ, threeZ=-rhinoY
// We do NOT apply a global scale — we let the bounding box do the normalisation
// after all blocks are loaded, by moving them. Vertices stay in Rhino feet units
// (≈100s of feet) — Three can handle that, we just fit the camera to match.
function parseOBJ(text) {
  const rv=[], rn=[], pos=[], nrm=[];
  for (const raw of text.split('\n')) {
    const p = raw.trim().split(/\s+/);
    if (!p[0]) continue;
    if (p[0]==='v') {
      rv.push(+p[1], +p[3], -p[2]);   // axis swap
    } else if (p[0]==='vn') {
      rn.push(+p[1], +p[3], -p[2]);
    } else if (p[0]==='f') {
      const cs = p.slice(1).map(t=>{
        const s=t.split('/');
        return {vi:(+s[0])-1, ni:s.length>=3&&s[2]!==''?(+s[2])-1:(+s[0])-1};
      });
      for (let i=1;i<cs.length-1;i++) {
        for (const c of [cs[0],cs[i],cs[i+1]]) {
          pos.push(rv[c.vi*3],rv[c.vi*3+1],rv[c.vi*3+2]);
          if (rn.length) nrm.push(rn[c.ni*3],rn[c.ni*3+1],rn[c.ni*3+2]);
        }
      }
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  if (nrm.length) geo.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(nrm),3));
  else geo.computeVertexNormals();
  return geo;
}

// ─── BLOCK STORE ──────────────────────────────────────────────────────────────
const blocks=[];
let currentMode='pile';

// ─── LOAD ─────────────────────────────────────────────────────────────────────
let loaded=0;
const lbar=document.getElementById('lbar');
const lcount=document.getElementById('lcount');

async function loadAll() {
  const promises=[];
  for (let i=1;i<=TOTAL;i++) {
    const idx=String(i).padStart(2,'0');
    promises.push(
      fetch(`${BASE_URL}Object_${idx}.obj`)
        .then(r=>{if(!r.ok)throw r.status; return r.text();})
        .then(text=>{
          const geo=parseOBJ(text);
          const mesh=new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
            color:PALETTE[(i-1)%PALETTE.length], roughness:0.55, metalness:0.05
          }));
          mesh.castShadow=mesh.receiveShadow=true;
          mesh.userData.idx=i;
          scene.add(mesh);
          blocks.push({
            mesh,
            homePos:new THREE.Vector3(),
            targetPos:new THREE.Vector3(),
            wobblePhase:Math.random()*Math.PI*2,
            wobbleAmp:0,
          });
        })
        .catch(e=>console.warn(`Object_${idx}.obj failed:`,e))
        .finally(()=>{
          loaded++;
          lbar.style.width=Math.round(loaded/TOTAL*100)+'%';
          lcount.textContent=`${loaded} / ${TOTAL}`;
        })
    );
  }
  await Promise.all(promises);
  onAllLoaded();
}

function onAllLoaded() {
  if (!blocks.length){console.error('no blocks');return;}

  // compute full bounding box
  const box=new THREE.Box3();
  blocks.forEach(b=>box.expandByObject(b.mesh));
  const center=new THREE.Vector3(); box.getCenter(center);
  const size=new THREE.Vector3();   box.getSize(size);

  // shift so massing sits centred at x=0, z=0, bottom at y=0
  blocks.forEach(b=>{
    b.mesh.position.x -= center.x;
    b.mesh.position.y -= box.min.y;
    b.mesh.position.z -= center.z;
    b.homePos.copy(b.mesh.position);
    b.targetPos.copy(b.mesh.position);
  });

  // update floor/grid to y=0
  floorMesh.position.y=0;
  grid.position.y=0.1;

  // fit camera: look at centre of massing
  const H = size.y;
  const D = Math.max(size.x, size.z);
  orb.r   = D*1.5 + H*0.5;
  orbTarget.set(0, H*0.4, 0);
  applyOrbit();

  // hide loader
  const el=document.getElementById('loading');
  el.style.opacity='0';
  setTimeout(()=>el.remove(),800);
}

loadAll();

// ─── ORBIT ────────────────────────────────────────────────────────────────────
const orb={theta:0.4,phi:0.45,r:300};  // phi<0.5 = looking down from above
const orbTarget=new THREE.Vector3(0,50,0);

function applyOrbit(){
  camera.position.set(
    orbTarget.x+orb.r*Math.sin(orb.phi)*Math.sin(orb.theta),
    orbTarget.y+orb.r*Math.cos(orb.phi),
    orbTarget.z+orb.r*Math.sin(orb.phi)*Math.cos(orb.theta)
  );
  camera.lookAt(orbTarget);
}
applyOrbit();

// ─── INTERACTION ──────────────────────────────────────────────────────────────
let isOrbiting=false, orbitStart={x:0,y:0}, orbitPrev={theta:0,phi:0};
let hoveredBlock=null, draggedBlock=null;
const dragPlane=new THREE.Plane();
const dragHit=new THREE.Vector3();
const dragOff=new THREE.Vector3();
const raycaster=new THREE.Raycaster();
const mouse2d=new THREE.Vector2();
const cursor=document.getElementById('cursor');
const blockTag=document.getElementById('block-tag');

window.addEventListener('mousemove',e=>{
  cursor.style.left=e.clientX+'px';
  cursor.style.top=e.clientY+'px';
  mouse2d.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);

  if (draggedBlock){
    raycaster.setFromCamera(mouse2d,camera);
    if (raycaster.ray.intersectPlane(dragPlane,dragHit))
      draggedBlock.targetPos.copy(dragHit.clone().sub(dragOff));
    return;
  }

  if (isOrbiting){
    orb.theta=orbitPrev.theta-(e.clientX-orbitStart.x)*0.006;
    orb.phi=Math.max(0.1,Math.min(Math.PI*0.46,orbitPrev.phi+(e.clientY-orbitStart.y)*0.006));
    applyOrbit();
    return;
  }

  raycaster.setFromCamera(mouse2d,camera);
  const hits=raycaster.intersectObjects(blocks.map(b=>b.mesh));
  if (hits.length){
    const hit=blocks.find(b=>b.mesh===hits[0].object);
    if (hit!==hoveredBlock){
      // clear old hover
      if(hoveredBlock) hoveredBlock.mesh.material.emissive.setScalar(0);
      hoveredBlock=hit;
      // highlight new hover with emissive glow
      if(hit) hit.mesh.material.emissive.setScalar(0.12);
    }
    cursor.classList.add('hovering');
    blockTag.style.opacity='1';
    blockTag.style.left=(e.clientX+14)+'px';
    blockTag.style.top=(e.clientY-8)+'px';
    blockTag.textContent=currentMode==='explode'
      ?`Block ${hit.mesh.userData.idx} · drag to move`
      :`Block ${hit.mesh.userData.idx}`;
  } else {
    if(hoveredBlock){ hoveredBlock.mesh.material.emissive.setScalar(0); hoveredBlock=null; }
    cursor.classList.remove('hovering');
    blockTag.style.opacity='0';
  }
});

window.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  if(hoveredBlock&&currentMode==='explode'){
    draggedBlock=hoveredBlock;
    draggedBlock.mesh.material.emissive.setScalar(0);
    cursor.classList.add('grabbed');
    const camDir=new THREE.Vector3(); camera.getWorldDirection(camDir);
    dragPlane.setFromNormalAndCoplanarPoint(camDir,draggedBlock.mesh.position);
    raycaster.setFromCamera(mouse2d,camera);
    if(raycaster.ray.intersectPlane(dragPlane,dragHit))
      dragOff.copy(dragHit.clone().sub(draggedBlock.mesh.position));
    return;
  }
  isOrbiting=true;
  orbitStart={x:e.clientX,y:e.clientY};
  orbitPrev={theta:orb.theta,phi:orb.phi};
});

window.addEventListener('mouseup',()=>{
  if(draggedBlock){
    draggedBlock.homePos.copy(draggedBlock.targetPos);
    draggedBlock=null;
    cursor.classList.remove('grabbed');
  }
  isOrbiting=false;
});

window.addEventListener('wheel',e=>{
  orb.r=Math.max(10,Math.min(2000,orb.r+e.deltaY*0.5));
  applyOrbit();
},{passive:true});

// ─── MODE SWITCH ──────────────────────────────────────────────────────────────
function setMode(mode){
  currentMode=mode;
  document.getElementById('btn-pile').classList.toggle('active',mode==='pile');
  document.getElementById('btn-explode').classList.toggle('active',mode==='explode');

  if(mode==='pile'){
    blocks.forEach(b=>b.targetPos.copy(b.homePos));
    document.getElementById('hint').innerHTML='drag · orbit<br>scroll · zoom';
  } else {
    const box=new THREE.Box3();
    blocks.forEach(b=>box.expandByPoint(b.homePos));
    const sz=new THREE.Vector3(); box.getSize(sz);
    const spread=Math.max(sz.x,sz.z)*0.7;
    blocks.forEach((b,i)=>{
      const angle=(i/blocks.length)*Math.PI*2+Math.random()*0.4;
      const r=spread*(0.5+Math.random()*0.8);
      b.targetPos.set(
        b.homePos.x+Math.cos(angle)*r,
        b.homePos.y,
        b.homePos.z+Math.sin(angle)*r
      );
    });
    document.getElementById('hint').innerHTML='click & drag blocks<br>scroll · zoom';
  }
}

// ─── ANIMATION ────────────────────────────────────────────────────────────────
const clock=new THREE.Clock();
const SNAP_THRESHOLD=2; // feet — snap when within 2ft of target

function animate(){
  requestAnimationFrame(animate);
  blocks.forEach(b=>{
    const dist=b.mesh.position.distanceTo(b.targetPos);
    if(dist>SNAP_THRESHOLD) b.mesh.position.lerp(b.targetPos,0.10);
    else b.mesh.position.copy(b.targetPos);
    // scale always 1 — any scale animation breaks raycaster hover detection
    b.mesh.scale.setScalar(1.0);
  });
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>

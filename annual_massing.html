<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#EDE8E2; overflow:hidden; font-family:'DM Sans',sans-serif; cursor:none; }
canvas { display:block; position:fixed; top:0; left:0; }
#cursor {
  position:fixed; width:12px; height:12px; background:#1a1a1a;
  border-radius:50%; pointer-events:none; z-index:1000;
  transform:translate(-50%,-50%);
  transition: width .18s, height .18s, background .18s;
}
#cursor.hovering { width:30px; height:30px; background:rgba(26,26,26,.08); border:1.5px solid #1a1a1a; }
#cursor.grabbed  { width:18px; height:18px; background:#E8635A; border:none; }
#nav {
  position:fixed; top:0; left:0; right:0; z-index:200;
  display:flex; align-items:center; justify-content:space-between;
  padding:24px 40px; pointer-events:none;
}
.nav-logo { pointer-events:auto; }
.nav-logo-sub { font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:#aaa; }
.nav-logo-main { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; color:#1a1a1a; margin-top:2px; }
.nav-links { pointer-events:auto; display:flex; gap:8px; }
.nav-link {

}
.nav-link.active { background:#1a1a1a; color:#fff; border-color:#1a1a1a; }
.nav-link:hover:not(.active) { background:#fff; color:#1a1a1a; }
#mode-toggle {
  position:fixed; bottom:40px; left:50%; transform:translateX(-50%);

}
.mode-btn {
  padding:10px 28px; font-size:10px; font-weight:500;
  letter-spacing:.12em; text-transform:uppercase;

}
.mode-btn.active { background:#1a1a1a; color:#fff; }

  position:fixed; bottom:44px; right:40px; z-index:200;

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const TOTAL    = 37;
const BASE_URL = 'https://raw.githubusercontent.com/Hongyu-C/The-Annual/main/models/';
const PALETTE  = [0xE8635A,0xF2C94C,0x9B8EC4,0xF4A7B9,0x5BC8C8,0xA8D8A8,0xF7956E,0x7B9FB8];

// ── RENDERER ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xEDE8E2);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,5000);

// ── LIGHTS ────────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xfff8f0,0.7));
const sun=new THREE.DirectionalLight(0xfff0d8,1.1);
sun.position.set(200,400,250);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=10; sun.shadow.camera.far=3000;
sun.shadow.camera.left=sun.shadow.camera.bottom=-600;
sun.shadow.camera.right=sun.shadow.camera.top=600;
sun.shadow.bias=-0.0005;
scene.add(sun);
const fill=new THREE.DirectionalLight(0xffe8d0,0.15);
fill.position.set(-150,100,-200);
scene.add(fill);

// ── FLOOR ─────────────────────────────────────────────────────────────────────
const floorMesh=new THREE.Mesh(
  new THREE.PlaneGeometry(5000,5000),
  new THREE.ShadowMaterial({opacity:0.18})
);
floorMesh.rotation.x=-Math.PI/2;
floorMesh.position.y=0;
floorMesh.receiveShadow=true;
scene.add(floorMesh);
const grid=new THREE.GridHelper(2000,80,0xcccccc,0xdddddd);
grid.material.opacity=0.18; grid.material.transparent=true;
scene.add(grid);

// ── OBJ PARSER ────────────────────────────────────────────────────────────────
// Each OBJ is parsed with vertices kept in LOCAL space (centred at origin).
// The block's WORLD position (from Rhino) is extracted separately as centroid,
// and stored in mesh.position. This way mesh.position is always meaningful.
//
// Rhino exports with Z-up. We want Y-up (Three.js convention):
//   threeX =  rhinoX
//   threeY =  rhinoZ   (Rhino's Z becomes Three's Y)
//   threeZ = -rhinoY   (Rhino's Y becomes Three's -Z)

function parseOBJ(text){
  // Step 1: collect raw Rhino vertices (Z-up)
  const rhinoV=[];
  const lines=text.split('\n');
  for(const raw of lines){
    const p=raw.trim().split(/\s+/);
    if(p[0]==='v') rhinoV.push(+p[1],+p[2],+p[3]);
  }

  // Step 2: compute centroid in Three-space (after axis swap)
  let cx=0,cy=0,cz=0;
  const n=rhinoV.length/3;
  for(let i=0;i<n;i++){
    cx+=rhinoV[i*3];
    cy+=rhinoV[i*3+1];  // rhinoY is already height
    cz+=rhinoV[i*3+2];
  }
  cx/=n; cy/=n; cz/=n;
  const centroid=new THREE.Vector3(cx,cy,cz);

  // Step 3: build geometry with vertices centred at origin
  const rhinoN=[];
  const pos=[],nrm=[];
  for(const raw of lines){
    const p=raw.trim().split(/\s+/);
    if(p[0]==='vn') rhinoN.push(+p[1],+p[2],+p[3]);
  }
  for(const raw of lines){
    const p=raw.trim().split(/\s+/);
    if(p[0]!=='f') continue;
    const cs=p.slice(1).map(t=>{
      const s=t.split('/');
      return{vi:(+s[0])-1, ni:s.length>=3&&s[2]!==''?(+s[2])-1:(+s[0])-1};
    });
    for(let i=1;i<cs.length-1;i++){
      for(const c of[cs[0],cs[i],cs[i+1]]){
        const vi=c.vi;
        // axis swap + subtract centroid → local coords
        pos.push(
          rhinoV[vi*3  ]-cx,
          rhinoV[vi*3+1]-cy,
          rhinoV[vi*3+2]-cz
        );
        if(rhinoN.length){
          const ni=c.ni;
          nrm.push(rhinoN[ni*3], rhinoN[ni*3+1], rhinoN[ni*3+2]);
        }
      }
    }
  }

  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  if(nrm.length) geo.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(nrm),3));
  else geo.computeVertexNormals();

  return {geo, centroid};
}

// ── BLOCK STORE ───────────────────────────────────────────────────────────────
const blocks=[];
let currentMode='pile';
let explodeOffsets=null; // pre-computed, fixed per block

// ── LOAD ──────────────────────────────────────────────────────────────────────
let loaded=0;
const lbar=document.getElementById('lbar');
const lcount=document.getElementById('lcount');

async function loadAll(){
  const promises=[];
  for(let i=1;i<=TOTAL;i++){
    const idx=String(i).padStart(2,'0');
    promises.push(
      fetch(`${BASE_URL}Object_${idx}.obj`)
        .then(r=>{if(!r.ok)throw r.status; return r.text();})
        .then(text=>{
          const {geo,centroid}=parseOBJ(text);
          const color=new THREE.Color(PALETTE[(i-1)%PALETTE.length]);
          const mat=new THREE.MeshStandardMaterial({
            color: color.clone(),
            roughness:0.82, metalness:0.0,
          });
          const mesh=new THREE.Mesh(geo,mat);
          mesh.castShadow=mesh.receiveShadow=true;
          mesh.userData.idx=i;
          mesh.position.copy(centroid);
          scene.add(mesh);
          blocks.push({
            mesh,
            originalColor: color.clone(), // saved candy color
            homePos: centroid.clone(),
            originalPos: centroid.clone(),
            targetPos: centroid.clone(),
          });
        })
        .catch(e=>console.warn(`Object_${idx}.obj:`,e))
        .finally(()=>{
          loaded++;
          lbar.style.width=Math.round(loaded/TOTAL*100)+'%';
          lcount.textContent=`${loaded} / ${TOTAL}`;
        })
    );
  }
  await Promise.all(promises);
  onAllLoaded();
}

function onAllLoaded(){
  if(!blocks.length){console.error('no blocks'); return;}

  // Compute bounding box of all block centroids
  const box=new THREE.Box3();
  blocks.forEach(b=>box.expandByPoint(b.homePos));
  const center=new THREE.Vector3(); box.getCenter(center);
  const size=new THREE.Vector3();   box.getSize(size);

  // Shift so massing is centred at X=0,Z=0 and bottom sits at Y=0
  const shiftX=center.x, shiftY=box.min.y, shiftZ=center.z;
  blocks.forEach(b=>{
    b.mesh.position.x -= shiftX;
    b.mesh.position.y -= shiftY;
    b.mesh.position.z -= shiftZ;
    b.homePos.copy(b.mesh.position);
    b.originalPos.copy(b.mesh.position);
    b.targetPos.copy(b.mesh.position);
    // physics state
    b.vel     = new THREE.Vector3();
    b.sleeping= true;
    b.sleepCounter= SLEEP_FRAMES;
    b.radius  = 1; // placeholder, set properly in initPhysicsBodies
    b.dragVelX= 0;
    b.dragVelZ= 0;
    b.squishT = 0;
  });

  floorMesh.position.y=0;
  grid.position.y=1;

  // Pre-compute fixed explode offsets (deterministic, not random)
  const D=Math.max(size.x,size.z);
  const spread=D*0.4;  // tighter spread — mm units so D is already large
  explodeOffsets=blocks.map((_,i)=>{
    const angle=(i/blocks.length)*Math.PI*2 + (i%5)*0.3;
    const r=spread*(0.2 + (i%7)/7*0.5);
    return {dx: Math.cos(angle)*r, dz: Math.sin(angle)*r};
  });

  // init physics sphere radii
  initPhysicsBodies();

  // Y drag limit = 1.8x massing height
  dragYMax = size.y * 1.8;

  // expand shadow camera to cover actual massing footprint
  const halfD=Math.max(size.x,size.z)*0.75;
  sun.shadow.camera.left=sun.shadow.camera.bottom=-halfD;
  sun.shadow.camera.right=sun.shadow.camera.top=halfD;
  sun.shadow.camera.updateProjectionMatrix();

  // Fit camera
  const H=size.y;
  orb.r   = D*1.4+H*0.5;
  orb.phi = 0.72;
  orb.theta=0.55;
  orbTarget.set(0, H*0.38, 0);
  applyOrbit();

  // set person scale relative to massing height
  // a person should be ~1/50 of massing height visually
  window._massingH  = H;
  window._massingDX = size.x;
  window._massingDZ = size.z;
  window._massingScale = H / 1700;
  console.log('massing size:', size, '| scale factor:', window._massingScale);

  document.getElementById('loading').style.opacity='0';
  setTimeout(()=>document.getElementById('loading').remove(),800);
}

loadAll();

// ── ORBIT ─────────────────────────────────────────────────────────────────────
const orb={theta:0.55, phi:0.72, r:500};
const orbTarget=new THREE.Vector3(0,80,0);

function applyOrbit(){
  camera.position.set(
    orbTarget.x + orb.r*Math.sin(orb.phi)*Math.sin(orb.theta),
    orbTarget.y + orb.r*Math.cos(orb.phi),
    orbTarget.z + orb.r*Math.sin(orb.phi)*Math.cos(orb.theta)
  );
  camera.lookAt(orbTarget);
}
applyOrbit();

// ── INTERACTION ───────────────────────────────────────────────────────────────
let isOrbiting=false, orbitStart={x:0,y:0}, orbitSnap={theta:0,phi:0};
let isPanning=false, panStart={x:0,y:0}, panSnapTarget={x:0,y:0,z:0};
let hoveredBlock=null, draggedBlock=null;
let dragYMax=10000;
const dragPlane=new THREE.Plane();
const dragHit=new THREE.Vector3();
const dragOffset=new THREE.Vector3();
const raycaster=new THREE.Raycaster();
const mouse2d=new THREE.Vector2();
const cursorEl=document.getElementById('cursor');
const blockTag=document.getElementById('block-tag');

function setEmissive(b,v){ if(b) b.mesh.material.emissive.setScalar(v); }

// build camera-facing plane through a given world point
function setCameraPlane(point){
  const camDir=new THREE.Vector3();
  camera.getWorldDirection(camDir);
  dragPlane.setFromNormalAndCoplanarPoint(camDir, point);
}

window.addEventListener('mousemove',e=>{
  cursorEl.style.left=e.clientX+'px';
  cursorEl.style.top=e.clientY+'px';
  mouse2d.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);

  if(draggedBlock){
    // rebuild plane each frame so it stays facing camera as user orbits
    setCameraPlane(draggedBlock.mesh.position);
    raycaster.setFromCamera(mouse2d,camera);
    if(raycaster.ray.intersectPlane(dragPlane,dragHit)){
      draggedBlock.vel.set(0,0,0);
      const nx=dragHit.x-dragOffset.x;
      const ny=Math.max(0, Math.min(dragYMax, dragHit.y-dragOffset.y));
      const nz=dragHit.z-dragOffset.z;
      // track velocity for inertia
      draggedBlock.dragVelX=(nx-draggedBlock.targetPos.x)*0.6+draggedBlock.dragVelX*0.4;
      draggedBlock.dragVelZ=(nz-draggedBlock.targetPos.z)*0.6+draggedBlock.dragVelZ*0.4;
      draggedBlock.targetPos.set(nx, ny, nz);
    }
    return;
  }

  if(isOrbiting){
    orb.theta=orbitSnap.theta-(e.clientX-orbitStart.x)*0.007;
    orb.phi=Math.max(0.05,Math.min(1.45,orbitSnap.phi+(e.clientY-orbitStart.y)*0.007));
    applyOrbit();
    return;
  }

  if(isPanning){
    const dx=e.clientX-panStart.x;
    const dy=e.clientY-panStart.y;
    // pan speed scales with orbit radius
    const speed=orb.r*0.0012;
    // camera right and up vectors
    const right=new THREE.Vector3();
    const up=new THREE.Vector3(0,1,0);
    right.crossVectors(up, new THREE.Vector3(
      Math.sin(orb.phi)*Math.sin(orb.theta),
      Math.cos(orb.phi),
      Math.sin(orb.phi)*Math.cos(orb.theta)
    )).normalize();
    orbTarget.x=panSnapTarget.x + right.x*dx*speed;
    orbTarget.y=panSnapTarget.y - dy*speed;
    orbTarget.z=panSnapTarget.z + right.z*dx*speed;
    applyOrbit();
    return;
  }

  // hover detection
  raycaster.setFromCamera(mouse2d,camera);
  const hits=raycaster.intersectObjects(blocks.map(b=>b.mesh));
  if(hits.length){
    const hit=blocks.find(b=>b.mesh===hits[0].object);
    if(!hit) return;
    if(hit!==hoveredBlock){
      setEmissive(hoveredBlock,0);
      hoveredBlock=hit;
      setEmissive(hit,0.12);
    }
    cursorEl.classList.add('hovering');
    blockTag.style.opacity='1';
    blockTag.style.left=(e.clientX+14)+'px';
    blockTag.style.top=(e.clientY-8)+'px';
    blockTag.textContent=currentMode==='explode'
      ?`Block ${hit.mesh.userData.idx} · drag to move`
      :`Block ${hit.mesh.userData.idx}`;
  } else {
    if(hoveredBlock){setEmissive(hoveredBlock,0);hoveredBlock=null;}
    cursorEl.classList.remove('hovering');
    blockTag.style.opacity='0';
  }
});

window.addEventListener('mousedown',e=>{
  if(e.button!==0) return;
  if(currentMode==='explode' && hoveredBlock){
    hoveredBlock.squishT=1;
    draggedBlock=hoveredBlock;
    draggedBlock.dragVelX=0;
    draggedBlock.dragVelZ=0;
    setEmissive(draggedBlock,0);
    cursorEl.classList.add('grabbed');
    cursorEl.classList.remove('hovering');
    // build initial camera-facing plane through block centre
    setCameraPlane(draggedBlock.mesh.position);
    raycaster.setFromCamera(mouse2d,camera);
    const planeHit=raycaster.ray.intersectPlane(dragPlane,dragHit);
    if(planeHit){
      dragOffset.set(
        dragHit.x-draggedBlock.mesh.position.x,
        dragHit.y-draggedBlock.mesh.position.y,
        dragHit.z-draggedBlock.mesh.position.z
      );
    } else {
      dragOffset.set(0,0,0);
    }
    return;
  }
  isOrbiting=true;
  orbitStart={x:e.clientX,y:e.clientY};
  orbitSnap={theta:orb.theta,phi:orb.phi};
});

// right or middle click = pan
window.addEventListener('mousedown',e=>{
  if(e.button===1||e.button===2){
    e.preventDefault();
    isPanning=true;
    panStart={x:e.clientX,y:e.clientY};
    panSnapTarget={x:orbTarget.x,y:orbTarget.y,z:orbTarget.z};
  }
});

window.addEventListener('mouseup',e=>{
  if(e.button===1||e.button===2) isPanning=false;
});

window.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('mouseup',()=>{
  if(draggedBlock){
    draggedBlock.vel.set(
      draggedBlock.dragVelX*55,
      0,
      draggedBlock.dragVelZ*55
    );
    wakeBlock(draggedBlock);
    draggedBlock.homePos.copy(draggedBlock.targetPos);
    draggedBlock=null;
    cursorEl.classList.remove('grabbed');
  }
  isOrbiting=false;
});

window.addEventListener('wheel',e=>{
  orb.r=Math.max(20,Math.min(3000,orb.r+e.deltaY*0.8));
  applyOrbit();
},{passive:true});

// ── MODE SWITCH ───────────────────────────────────────────────────────────────
const PILE_COLOR = new THREE.Color(0xD4C8B8); // warm light tan

      b.mesh.material.opacity=1; b.mesh.material.transparent=false;
      b.mesh.material.roughness=0.82; b.mesh.material.needsUpdate=true;
    });

  } else if(mode==='program'){

  } else if(mode==='circuit'){

// ── RESET ─────────────────────────────────────────────────────────────────────
function resetAll(){

// ── PHYSICS CONSTANTS ─────────────────────────────────────────────────────────
const GRAVITY   = -2800;  // mm/s²
const BOUNCE    = 0.35;   // restitution
const FRICTION  = 0.82;   // horizontal damping on ground contact
const SNAP_DIST = 2;      // mm snap threshold for lerp
const SLEEP_VEL = 4;      // velocity threshold to enter sleep
const SLEEP_FRAMES = 12;  // frames of low velocity before sleeping

// compute bounding sphere radius for each block after load
// called from onAllLoaded after positions are finalised
function initPhysicsBodies(){
  blocks.forEach(b=>{
    const box=new THREE.Box3().setFromObject(b.mesh);
    const size=new THREE.Vector3(); box.getSize(size);
    b.radius=Math.max(size.x,size.y,size.z)*0.52;
    b.bbox=box; // store full bbox for POV ground detection
    b.bboxSize=size.clone();
    b.sleepCounter=SLEEP_FRAMES;
    b.sleeping=true;
  });
}

function wakeBlock(b){
  b.sleeping=false;
  b.sleepCounter=0;
}

// ── PERSON STATE (declared before animate so updatePersons can reference them) ──
const PERSON_COLORS = [0xE8635A,0x9B8EC4,0x5BC8C8,0xF2C94C,0xF4A7B9,0xA8D8A8,0xF7956E,0x7B9FB8];
const PERSON_HEIGHT = 1700;
const EYE_HEIGHT    = 1550;
const persons = [];
let activePOV = null;
let povYaw = 0, povPitch = 0;
const keysDown = {};

// ── ANIMATION + PHYSICS ───────────────────────────────────────────────────────
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);

  if(currentMode==='explode'){
    // ── physics step ────────────────────────────────────────────────────────
    blocks.forEach(b=>{
      if(b===draggedBlock || b.sleeping) return;

      // gravity
      b.vel.y+=GRAVITY*dt;

      // integrate position
      b.mesh.position.x+=b.vel.x*dt;
      b.mesh.position.y+=b.vel.y*dt;
      b.mesh.position.z+=b.vel.z*dt;

      // floor collision
      const floorY=b.radius*0.5; // rest height above y=0
      if(b.mesh.position.y<floorY){
        b.mesh.position.y=floorY;
        if(Math.abs(b.vel.y)>SLEEP_VEL){
          b.vel.y*=-BOUNCE;
          b.vel.x*=FRICTION;
          b.vel.z*=FRICTION;
        } else {
          b.vel.y=0;
          b.vel.x*=0.7;
          b.vel.z*=0.7;
        }
      }

      b.targetPos.copy(b.mesh.position);

      // sleep check
      const speed=b.vel.length();
      if(speed<SLEEP_VEL){
        b.sleepCounter++;
        if(b.sleepCounter>SLEEP_FRAMES){
          b.sleeping=true;
          b.vel.set(0,0,0);
          b.homePos.copy(b.mesh.position);
        }
      } else {
        b.sleepCounter=0;
      }
    });

    // ── sphere-sphere collision ──────────────────────────────────────────────
    for(let i=0;i<blocks.length;i++){
      const a=blocks[i];
      if(a===draggedBlock) continue;
      for(let j=i+1;j<blocks.length;j++){
        const b=blocks[j];
        if(b===draggedBlock) continue;
        if(a.sleeping && b.sleeping) continue;

        const dx=b.mesh.position.x-a.mesh.position.x;
        const dy=b.mesh.position.y-a.mesh.position.y;
        const dz=b.mesh.position.z-a.mesh.position.z;
        const dist=Math.sqrt(dx*dx+dy*dy+dz*dz)||0.001;
        const minDist=a.radius+b.radius;

        if(dist<minDist){
          // normalised separation axis
          const nx=dx/dist, ny=dy/dist, nz=dz/dist;
          // push apart
          const overlap=(minDist-dist)*0.5;
          if(!a.sleeping){
            a.mesh.position.x-=nx*overlap;
            a.mesh.position.y-=ny*overlap;
            a.mesh.position.z-=nz*overlap;
          }
          if(!b.sleeping){
            b.mesh.position.x+=nx*overlap;
            b.mesh.position.y+=ny*overlap;
            b.mesh.position.z+=nz*overlap;
          }
          // velocity exchange (elastic-ish)
          const relVel=(b.vel.x-a.vel.x)*nx+(b.vel.y-a.vel.y)*ny+(b.vel.z-a.vel.z)*nz;
          if(relVel<0){
            const impulse=relVel*(1+BOUNCE)*0.5;
            if(!a.sleeping){ a.vel.x+=impulse*nx; a.vel.y+=impulse*ny; a.vel.z+=impulse*nz; wakeBlock(a); }
            if(!b.sleeping){ b.vel.x-=impulse*nx; b.vel.y-=impulse*ny; b.vel.z-=impulse*nz; wakeBlock(b); }
          }
        }
      }
    }

    // dragged block: lerp mesh to targetPos (physics-driven for others)
    if(draggedBlock){
      const d=draggedBlock.mesh.position.distanceTo(draggedBlock.targetPos);
      if(d>SNAP_DIST) draggedBlock.mesh.position.lerp(draggedBlock.targetPos,0.22);
      else            draggedBlock.mesh.position.copy(draggedBlock.targetPos);
    }

  } else {
    // pile mode: simple lerp, no physics
    blocks.forEach(b=>{
      const d=b.mesh.position.distanceTo(b.targetPos);
      if(d>SNAP_DIST) b.mesh.position.lerp(b.targetPos,0.09);
      else            b.mesh.position.copy(b.targetPos);
    });
  }

  // squish animation — always runs regardless of mode
  blocks.forEach(b=>{
    if(b.squishT>0){
      b.squishT=Math.max(0,b.squishT-dt*1.8);
      const s=Math.sin(b.squishT*Math.PI);
      b.mesh.scale.set(1+s*0.10, 1-s*0.08, 1+s*0.10);
    } else {
      b.mesh.scale.set(1,1,1);
    }
  });

  // update persons (physics + POV camera)
  updatePersons(dt);

  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// ── PERSON SYSTEM ─────────────────────────────────────────────────────────────

// build a simple person mesh: capsule-ish (sphere head + cylinder body) + dot eyes
function makePersonMesh(color){
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color, roughness:0.7, metalness:0});
  // person is ~1/40 of massing height
  const s = (window._massingH || 5000) / 36;

  const body = new THREE.Mesh(new THREE.CylinderGeometry(s*0.05,s*0.06,s*0.55,12), mat);
  body.position.y = s*0.28;
  body.castShadow = true;
  group.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(s*0.09,14,10), mat);
  head.position.y = s*0.68;
  head.castShadow = true;
  group.add(head);

  const eyeMat = new THREE.MeshBasicMaterial({color:0x1a1a1a});
  const eyeGeo = new THREE.SphereGeometry(s*0.013,8,6);
  [-s*0.035, s*0.035].forEach(x=>{
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.position.set(x, s*0.71, s*0.075);
    group.add(eye);
  });

  // store scale for physics reference
  group.userData.personHeight = s*0.77; // top of head
  group.userData.eyeHeight    = s*0.65;
  return group;
}

// build a simple person mesh with emissive glow
function makePersonMesh(color){
  const group = new THREE.Group();
  const s = (window._massingH || 5000) / 36;

  // emissive material so person glows even when small
  const mat = new THREE.MeshStandardMaterial({
    color, roughness:0.6, metalness:0,
    emissive: new THREE.Color(color),
    emissiveIntensity: 0.5,
  });

  const body = new THREE.Mesh(new THREE.CylinderGeometry(s*0.05,s*0.06,s*0.55,12), mat);
  body.position.y = s*0.28; body.castShadow=true; group.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(s*0.09,14,10), mat);
  head.position.y = s*0.68; head.castShadow=true; group.add(head);

  const eyeMat = new THREE.MeshBasicMaterial({color:0x1a1a1a});
  const eyeGeo = new THREE.SphereGeometry(s*0.014,8,6);
  [-s*0.035, s*0.035].forEach(x=>{
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.position.set(x, s*0.71, s*0.08);
    group.add(eye);
  });

  group.userData.personHeight = s*0.77;
  group.userData.eyeHeight    = s*0.65;
  group.userData.radius       = s*0.12; // collision sphere
  return group;
}

// drop line: vertical line from person down to ground, shows while falling
function makeDropLine(color){
  const mat = new THREE.LineBasicMaterial({color, opacity:0.5, transparent:true});
  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0,0,0),
    new THREE.Vector3(0,-9999,0),
  ]);
  return new THREE.Line(geo, mat);
}

function spawnPerson(){
  if(!window._massingH){ alert('Still loading, please wait!'); return; }
  const idx = persons.length % PERSON_COLORS.length;
  const color = PERSON_COLORS[idx];
  const colorHex = '#'+color.toString(16).padStart(6,'0');

  const mesh = makePersonMesh(color);
  const dropLine = makeDropLine(color);
  const spawnH = window._massingH * 2.5;
  const dx = window._massingDX || window._massingH;
  const dz = window._massingDZ || window._massingH;
  const spawnX = (Math.random()-0.5) * dx * 1.1;
  const spawnZ = (Math.random()-0.5) * dz * 1.1;
  mesh.position.set(spawnX, spawnH, spawnZ);
  dropLine.position.set(spawnX, spawnH, spawnZ);
  scene.add(mesh);
  scene.add(dropLine);

  const eyeH = mesh.userData.eyeHeight;
  const pRadius = mesh.userData.radius;
  const person = {
    mesh, dropLine,
    color, colorHex,
    idx: persons.length+1,
    vel: new THREE.Vector3(),
    falling: true,
    grounded: false,
    groundY: 0,
    eyeHeight: eyeH,
    radius: pRadius,
  };
  persons.push(person);

  const card = document.createElement('div');
  card.className = 'person-card';
  card.id = `pcard-${person.idx}`;
  card.innerHTML = `
    <div class="person-dot" style="background:${colorHex}"></div>
    <div class="person-label">Person ${person.idx}</div>
    <div class="person-pov">POV</div>
  `;
  card.onclick = ()=> enterPOV(person);
  document.getElementById('person-list').appendChild(card);
}

// ── POV mode ──────────────────────────────────────────────────────────────────
function enterPOV(person){
  activePOV = person;
  povYaw   = 0;
  povPitch = 0;

  // hide person mesh while in their POV
  person.mesh.visible = false;

  // update UI
  document.querySelectorAll('.person-card').forEach(c=>c.classList.remove('active'));
  document.getElementById(`pcard-${person.idx}`).classList.add('active');
  document.getElementById('pov-bar').classList.add('visible');
  document.getElementById('pov-label').textContent = `Person ${person.idx} POV`;
  document.getElementById('pov-crosshair').classList.add('visible');
  document.getElementById('hint').innerHTML='WASD · move<br>mouse · look<br>space · jump';

  // lock pointer for mouse-look
  document.body.requestPointerLock();

  // switch camera to POV settings
  camera.fov = 75;
  camera.updateProjectionMatrix();
}

function exitPOV(){
  if(!activePOV) return;
  activePOV.mesh.visible = true;
  document.querySelectorAll('.person-card').forEach(c=>c.classList.remove('active'));
  document.getElementById('pov-bar').classList.remove('visible');
  document.getElementById('pov-crosshair').classList.remove('visible');
  document.getElementById('hint').innerHTML='left drag · orbit<br>right drag · pan<br>scroll · zoom';
  activePOV = null;

  // restore camera
  camera.fov = 42;
  camera.updateProjectionMatrix();
  document.exitPointerLock();
  applyOrbit();
}

// pointer lock mouse-look
document.addEventListener('mousemove', e=>{
  if(!activePOV) return;
  if(document.pointerLockElement !== document.body) return;
  povYaw   -= e.movementX * 0.002;
  povPitch  = Math.max(-Math.PI*0.45, Math.min(Math.PI*0.45, povPitch - e.movementY*0.002));
});

// WASD keys
window.addEventListener('keydown', e=>{ 
  keysDown[e.code]=true;
  if(e.code==='Escape' && activePOV) exitPOV();
  // jump on Space press (not hold)
  if(e.code==='Space' && activePOV && activePOV.grounded){
    activePOV.vel.y=(window._massingH||5000)*0.12;
    activePOV.grounded=false;
  }
});
window.addEventListener('keyup',   e=>{ keysDown[e.code]=false; });

// ── PERSON PHYSICS + POV CAMERA UPDATE (runs inside animate) ──────────────────
function updatePersons(dt){
  const PGRAVITY = -2800;
  const PBOUNCE  = 0.2;

  persons.forEach(p=>{
    if(!p.falling && !activePOV) return;

    if(p.falling){
      p.vel.y += PGRAVITY*dt;
      p.mesh.position.y += p.vel.y*dt;

      // sync drop line position
      if(p.dropLine){
        p.dropLine.position.x = p.mesh.position.x;
        p.dropLine.position.z = p.mesh.position.z;
        p.dropLine.position.y = p.mesh.position.y;
      }

      // land on blocks — check sphere overlap
      let landed = false;
      if(p.vel.y<0){
        blocks.forEach(b=>{
          if(landed) return;
          if(!b.bboxSize) return;
          const bx=b.mesh.position.x, bz=b.mesh.position.z;
          const halfX=b.bboxSize.x*0.5+p.radius, halfZ=b.bboxSize.z*0.5+p.radius;
          const px=p.mesh.position.x, pz=p.mesh.position.z;
          if(px > bx-halfX && px < bx+halfX && pz > bz-halfZ && pz < bz+halfZ){
            const topY=b.mesh.position.y+b.bboxSize.y*0.5;
            if(p.mesh.position.y < topY+p.radius && p.mesh.position.y > b.mesh.position.y){
              p.mesh.position.y = topY;
              p.vel.y *= -PBOUNCE;
              b.squishT = 1.0;
              if(b.sleeping) wakeBlock(b);
              if(Math.abs(p.vel.y)<10){
                p.vel.y=0; p.falling=false; p.grounded=true; p.groundY=topY;
                landed=true;
              }
            }
          }
        });
      }

      // floor fallback
      if(!landed && p.mesh.position.y <= 0){
        p.mesh.position.y = 0;
        p.vel.y *= -PBOUNCE;
        if(Math.abs(p.vel.y)<10){ p.vel.y=0; p.falling=false; p.grounded=true; p.groundY=0; }
      }

      // hide drop line once landed
      if(!p.falling && p.dropLine){
        scene.remove(p.dropLine);
        p.dropLine = null;
      }
    }

    // WASD movement in POV mode
    if(activePOV===p){
      const speed = (window._massingH||5000)*0.015; // scale speed to massing size
      if(keysDown['KeyW']||keysDown['ArrowUp']){
        p.mesh.position.x += Math.sin(povYaw)*speed;
        p.mesh.position.z += Math.cos(povYaw)*speed;
      }
      if(keysDown['KeyS']||keysDown['ArrowDown']){
        p.mesh.position.x -= Math.sin(povYaw)*speed;
        p.mesh.position.z -= Math.cos(povYaw)*speed;
      }
      if(keysDown['KeyA']||keysDown['ArrowLeft']){
        p.mesh.position.x += Math.cos(povYaw)*speed;
        p.mesh.position.z -= Math.sin(povYaw)*speed;
      }
      if(keysDown['KeyD']||keysDown['ArrowRight']){
        p.mesh.position.x -= Math.cos(povYaw)*speed;
        p.mesh.position.z += Math.sin(povYaw)*speed;
      }

      // ── POV physics ───────────────────────────────────────────────────────
      // find highest surface Y under person using actual block bounding boxes
      let supportY = 0; // floor default

      blocks.forEach(b=>{
        // update bbox world position (block may have moved)
        const bx=b.mesh.position.x, bz=b.mesh.position.z;
        const halfX=b.bboxSize.x*0.5, halfZ=b.bboxSize.z*0.5;
        const topY=b.mesh.position.y+b.bboxSize.y*0.5;
        // check if person is within block's XZ footprint
        const px=p.mesh.position.x, pz=p.mesh.position.z;
        if(px > bx-halfX && px < bx+halfX && pz > bz-halfZ && pz < bz+halfZ){
          supportY=Math.max(supportY, topY);
        }
      });

      // apply gravity
      p.vel.y += PGRAVITY*dt;
      p.mesh.position.y += p.vel.y*dt;

      // land on support surface
      if(p.mesh.position.y <= supportY){
        p.mesh.position.y = supportY;
        if(p.vel.y < 0) p.vel.y = 0;
        p.grounded = true;
      } else {
        p.grounded = false;
      }

      // jump handled in keydown event

      // position camera at eye height
      camera.position.set(
        p.mesh.position.x,
        p.mesh.position.y + p.eyeHeight,
        p.mesh.position.z
      );
      const lookDir = new THREE.Vector3(
        Math.sin(povYaw)*Math.cos(povPitch),
        Math.sin(povPitch),
        Math.cos(povYaw)*Math.cos(povPitch)
      );
      camera.lookAt(camera.position.clone().add(lookDir));
    }
  });
}

let displayMode='default';
let activeFilter='all';
let programExploded=false;
let circuitExploded=false;
let isDragging=false;
window.addEventListener('mousedown',()=>{isDragging=false;});
window.addEventListener('mousemove',()=>{isDragging=true;});

function applyDisplayColors(){
  blocks.forEach(b=>{
    const idx=b.mesh.userData.idx;
    if(displayMode==='program'){
      const prog=BLOCK_PROGRAM[idx]||'boh';
      if(activeFilter==='all'||activeFilter===prog){
        b.mesh.material.color.set(PROG_COLORS[prog]);
        b.mesh.material.opacity=1; b.mesh.material.transparent=false;
      } else {
        b.mesh.material.color.set(0xffffff);
        b.mesh.material.opacity=0.35; b.mesh.material.transparent=true;
      }
    } else if(displayMode==='circuit'){
      const circ=BLOCK_CIRCUIT[idx]||'room';
      if(activeFilter==='all'||activeFilter===circ){
        b.mesh.material.color.set(CIRCUIT_COLORS[circ]);
        b.mesh.material.opacity=1; b.mesh.material.transparent=false;
      } else {
        b.mesh.material.color.set(0xffffff);
        b.mesh.material.opacity=0.35; b.mesh.material.transparent=true;
      }
    }
    b.mesh.material.needsUpdate=true;
  });
}

function filterProgram(filter){
  activeFilter=filter;
  document.querySelectorAll('.prog-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById('prog-'+filter);
  if(el) el.classList.add('active');
  applyDisplayColors();
  if(programExploded) doProgramExplode();
}

function filterCircuit(filter){
  activeFilter=filter;
  document.querySelectorAll('.circ-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById('circ-'+filter);
  if(el) el.classList.add('active');
  applyDisplayColors();
  if(circuitExploded) doCircuitExplode();
}

function doProgramExplode(){
  const box=new THREE.Box3();
  blocks.forEach(b=>box.expandByPoint(b.originalPos));
  const center=new THREE.Vector3(); box.getCenter(center);
  const sz=new THREE.Vector3(); box.getSize(sz);
  const spread=Math.max(sz.x,sz.z)*0.5;

  // assign a fixed direction per program group
  const progOrder=['watch','learn','share','gather','hang','play','boh'];
  const progDir={};
  progOrder.forEach((p,i)=>{
    const angle=(i/progOrder.length)*Math.PI*2;
    progDir[p]={x:Math.cos(angle),z:Math.sin(angle)};
  });

  blocks.forEach(b=>{
    const idx=b.mesh.userData.idx;
    const prog=BLOCK_PROGRAM[idx]||'boh';
    if(activeFilter!=='all' && activeFilter!==prog){
      // non-selected: push further out
      const dir=progDir[prog]||{x:1,z:0};
      b.targetPos.set(
        b.originalPos.x+dir.x*spread*1.5,
        b.originalPos.y,
        b.originalPos.z+dir.z*spread*1.5
      );
    } else {
      // selected (or all): move to group position, keep relative offsets
      const dir=progDir[prog]||{x:1,z:0};
      const groupOffset=activeFilter==='all'?spread*0.6:0;
      b.targetPos.set(
        b.originalPos.x+dir.x*groupOffset,
        b.originalPos.y,
        b.originalPos.z+dir.z*groupOffset
      );
    }
  });
}

function toggleProgramExplode(){
  programExploded=!programExploded;
  const btn=document.getElementById('prog-explode-btn');
  btn.style.color=programExploded?'#1a1a1a':'#888';
  btn.style.fontWeight=programExploded?'600':'400';
  if(programExploded) doProgramExplode();
  else blocks.forEach(b=>b.targetPos.copy(b.originalPos));
}

function doCircuitExplode(){
  const H=window._massingH||200;
  const LAYER={museum:H*0.9,wander:H*0.3,pavilion:-H*0.1,room:-H*0.5};
  blocks.forEach(b=>{
    const idx=b.mesh.userData.idx;
    const circ=BLOCK_CIRCUIT[idx]||'room';
    b.targetPos.set(b.originalPos.x,b.originalPos.y+(LAYER[circ]||0),b.originalPos.z);
  });
}

function toggleCircuitExplode(){
  circuitExploded=!circuitExploded;
  const btn=document.getElementById('circ-explode-btn');
  btn.style.color=circuitExploded?'#1a1a1a':'#888';
  btn.style.fontWeight=circuitExploded?'600':'400';
  if(circuitExploded) doCircuitExplode();
  else blocks.forEach(b=>b.targetPos.copy(b.originalPos));
}

function showCard(blockIdx,screenX,screenY,clickedBlock){
  const data=BLOCK_CARD[blockIdx]; if(!data) return;
  const prog=BLOCK_PROGRAM[blockIdx]||'boh';
  const circ=BLOCK_CIRCUIT[blockIdx]||'room';
  const progLabel={watch:'Watch',play:'Play',share:'Share',
    learn:'Learn',gather:'Gather',hang:'Hang',boh:'BOH'};
  const circLabel={museum:'Museum Circuit',wander:'Wandering',pavilion:'Pavilion',room:'Room'};
  const progColor={watch:'#9E5A53',play:'#9E8040',share:'#4a7a9E',
    learn:'#6a609E',gather:'#9E6070',hang:'#3a8a8a',boh:'#5a8a5a'};
  document.getElementById('card-emoji').textContent=data.emoji;
  document.getElementById('card-program').textContent=progLabel[prog]||prog;
  document.getElementById('card-program').style.color=progColor[prog]||'#aaa';
  document.getElementById('card-name').textContent=data.name;
  document.getElementById('card-type').textContent=circLabel[circ]||circ;
  document.getElementById('card-desc').textContent=data.desc;
  let cx=screenX+16,cy=screenY-80;
  if(cx+240>innerWidth) cx=screenX-240;
  if(cy<10) cy=10;
  const card=document.getElementById('info-card');
  card.style.left=cx+'px'; card.style.top=cy+'px';
  // reset then bounce
  card.classList.remove('visible');
  card.style.transition='none';
  card.style.transform='scale(0.75) translateY(8px)';
  card.style.opacity='0';
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      card.style.transition='opacity .2s ease, transform .35s cubic-bezier(0.34,1.56,0.64,1)';
      card.style.transform='scale(1) translateY(0)';
      card.style.opacity='1';
      card.classList.add('visible');
    });
  });

  // squish the clicked block
  if(clickedBlock) clickedBlock.squishT=0.8;
}

function closeCard(){
  const card=document.getElementById('info-card');
  card.style.transition='opacity .2s ease, transform .2s ease';
  card.style.opacity='0';
  card.style.transform='scale(0.75) translateY(8px)';
  card.classList.remove('visible');
  setTimeout(()=>{ card.style.pointerEvents='none'; },200);
}

window.addEventListener('click',e=>{
  if(activePOV||isDragging) return;
  if(currentMode!=='program'&&currentMode!=='circuit') return;
  mouse2d.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(mouse2d,camera);
  const hits=raycaster.intersectObjects(blocks.map(b=>b.mesh));
  if(hits.length){
    const hit=blocks.find(b=>b.mesh===hits[0].object);
    if(hit) showCard(hit.mesh.userData.idx,e.clientX,e.clientY,hit);
  } else { closeCard(); }
});

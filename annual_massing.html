<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Annual — Massing</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#EDE8E2; overflow:hidden; font-family:'DM Sans',sans-serif; cursor:none; }
canvas { display:block; position:fixed; top:0; left:0; }

#cursor {
  position:fixed; width:12px; height:12px; background:#1a1a1a;
  border-radius:50%; pointer-events:none; z-index:1000;
  transform:translate(-50%,-50%);
  transition: width .18s, height .18s, background .18s;
}
#cursor.hovering { width:30px; height:30px; background:rgba(26,26,26,.08); border:1.5px solid #1a1a1a; }
#cursor.grabbed  { width:18px; height:18px; background:#E8635A; border:none; }

#nav {
  position:fixed; top:0; left:0; right:0; z-index:200;
  display:flex; align-items:center; justify-content:space-between;
  padding:24px 40px; pointer-events:none;
}
.nav-logo { pointer-events:auto; }
.nav-logo-sub { font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:#aaa; }
.nav-logo-main { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; color:#1a1a1a; margin-top:2px; }
.nav-links { pointer-events:auto; display:flex; gap:8px; }
.nav-link {
  background:rgba(255,255,255,.88); backdrop-filter:blur(8px);
  border:1px solid rgba(0,0,0,.08); padding:8px 18px;
  font-size:10px; font-weight:500; letter-spacing:.12em; text-transform:uppercase;
  color:#666; cursor:pointer; border-radius:100px; text-decoration:none; transition:all .2s;
}
.nav-link.active { background:#1a1a1a; color:#fff; border-color:#1a1a1a; }
.nav-link:hover:not(.active) { background:#fff; color:#1a1a1a; }

#mode-toggle {
  position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
  z-index:200; display:flex;
  background:rgba(255,255,255,.92); backdrop-filter:blur(12px);
  border:1px solid rgba(0,0,0,.08); border-radius:100px; padding:4px;
}
.mode-btn {
  padding:10px 28px; font-size:10px; font-weight:500;
  letter-spacing:.12em; text-transform:uppercase;
  color:#999; border:none; background:transparent; border-radius:100px;
  cursor:pointer; transition:all .3s;
}
.mode-btn.active { background:#1a1a1a; color:#fff; }

#hint {
  position:fixed; bottom:44px; right:40px; z-index:200;
  font-size:10px; letter-spacing:.15em; text-transform:uppercase;
  color:#bbb; text-align:right; line-height:1.9; pointer-events:none;
}

#loading {
  position:fixed; inset:0; background:#EDE8E2; z-index:500;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
  transition:opacity .8s ease;
}
.loading-title { font-family:'Syne',sans-serif; font-size:28px; font-weight:800; color:#1a1a1a; }
.loading-bar-wrap { width:180px; height:2px; background:rgba(0,0,0,.08); border-radius:2px; overflow:hidden; }
.loading-bar { height:100%; background:#E8635A; border-radius:2px; width:0%; transition:width .2s; }
.loading-count { font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:#aaa; }

#block-tag {
  position:fixed; z-index:300; background:#1a1a1a; color:#fff;
  font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  padding:5px 12px; border-radius:100px;
  pointer-events:none; opacity:0; transition:opacity .15s; white-space:nowrap;
}
</style>
</head>
<body>
<div id="cursor"></div>
<div id="loading">
  <div class="loading-title">The Annual</div>
  <div class="loading-bar-wrap"><div class="loading-bar" id="lbar"></div></div>
  <div class="loading-count" id="lcount">0 / 37</div>
</div>
<div id="nav">
  <div class="nav-logo">
    <div class="nav-logo-sub">The Annual</div>
    <div class="nav-logo-main">Massing</div>
  </div>
  <div class="nav-links">
    <a href="annual_program.html" class="nav-link">Program</a>
    <a href="annual_massing.html" class="nav-link active">Massing</a>
  </div>
</div>
<div id="mode-toggle">
  <button class="mode-btn active" id="btn-pile"    onclick="setMode('pile')">↳ Pile</button>
  <button class="mode-btn"        id="btn-explode" onclick="setMode('explode')">⊹ Blocks</button>
</div>
<div id="hint">drag · orbit<br>scroll · zoom</div>
<div id="block-tag"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── CONFIG ───────────────────────────────────────────────────────────────────
const TOTAL    = 37;
const BASE_URL = 'https://raw.githubusercontent.com/Hongyu-C/The-Annual/main/models/';
const PALETTE  = [0xE8635A,0xF2C94C,0x9B8EC4,0xF4A7B9,0x5BC8C8,0xA8D8A8,0xF7956E,0xB8D4E8];

// ── RENDERER ─────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xEDE8E2);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,5000);

// ── LIGHTS ───────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff,1.0));
const sun=new THREE.DirectionalLight(0xfff5e8,0.8);
sun.position.set(200,400,250);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=10; sun.shadow.camera.far=2000;
sun.shadow.camera.left=sun.shadow.camera.bottom=-400;
sun.shadow.camera.right=sun.shadow.camera.top=400;
sun.shadow.bias=-0.0005;
scene.add(sun);
const fill=new THREE.DirectionalLight(0xddeeff,0.3);
fill.position.set(-150,100,-200);
scene.add(fill);

// ── FLOOR ────────────────────────────────────────────────────────────────────
const floor=new THREE.Mesh(new THREE.PlaneGeometry(5000,5000),new THREE.ShadowMaterial({opacity:0.04}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const grid=new THREE.GridHelper(2000,80,0xcccccc,0xdddddd);
grid.material.opacity=0.18; grid.material.transparent=true; scene.add(grid);

// ── OBJ PARSER ───────────────────────────────────────────────────────────────
// Try both axis conventions — we'll auto-detect after load which way is up
// For now: keep Rhino native coords (X,Y,Z), centre+orient after load
function parseOBJ(text){
  const rv=[],rn=[],pos=[],nrm=[];
  for(const raw of text.split('\n')){
    const p=raw.trim().split(/\s+/);
    if(!p[0])continue;
    if(p[0]==='v' ){rv.push(+p[1],+p[2],+p[3]);}       // raw Rhino coords
    else if(p[0]==='vn'){rn.push(+p[1],+p[2],+p[3]);}
    else if(p[0]==='f'){
      const cs=p.slice(1).map(t=>{
        const s=t.split('/');
        return{vi:(+s[0])-1,ni:s.length>=3&&s[2]!==''?(+s[2])-1:(+s[0])-1};
      });
      for(let i=1;i<cs.length-1;i++){
        for(const c of[cs[0],cs[i],cs[i+1]]){
          pos.push(rv[c.vi*3],rv[c.vi*3+1],rv[c.vi*3+2]);
          if(rn.length)nrm.push(rn[c.ni*3],rn[c.ni*3+1],rn[c.ni*3+2]);
        }
      }
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  if(nrm.length)geo.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(nrm),3));
  else geo.computeVertexNormals();
  return geo;
}

// ── BLOCK STORE ──────────────────────────────────────────────────────────────
const blocks=[];
let currentMode='pile';
// Store fixed explode offsets per block so re-entering explode mode
// doesn't re-randomise (fixes the "explode on pile→explode" bug)
let explodeOffsets=null;

// ── LOAD ─────────────────────────────────────────────────────────────────────
let loaded=0;
const lbar=document.getElementById('lbar');
const lcount=document.getElementById('lcount');

async function loadAll(){
  const promises=[];
  for(let i=1;i<=TOTAL;i++){
    const idx=String(i).padStart(2,'0');
    promises.push(
      fetch(`${BASE_URL}Object_${idx}.obj`)
        .then(r=>{if(!r.ok)throw r.status;return r.text();})
        .then(text=>{
          const geo=parseOBJ(text);
          const mat=new THREE.MeshStandardMaterial({
            color:PALETTE[(i-1)%PALETTE.length],
            roughness:0.5,metalness:0.05,
          });
          const mesh=new THREE.Mesh(geo,mat);
          mesh.castShadow=mesh.receiveShadow=true;
          mesh.userData.idx=i;
          scene.add(mesh);
          blocks.push({
            mesh,
            homePos:new THREE.Vector3(),
            targetPos:new THREE.Vector3(),
          });
        })
        .catch(e=>console.warn(`Object_${idx}.obj failed:`,e))
        .finally(()=>{
          loaded++;
          lbar.style.width=Math.round(loaded/TOTAL*100)+'%';
          lcount.textContent=`${loaded} / ${TOTAL}`;
        })
    );
  }
  await Promise.all(promises);
  onAllLoaded();
}

function onAllLoaded(){
  if(!blocks.length){console.error('no blocks');return;}

  // ── Compute bounding box in RAW Rhino coords ──────────────────────────────
  const box=new THREE.Box3();
  blocks.forEach(b=>box.expandByObject(b.mesh));
  const center=new THREE.Vector3(); box.getCenter(center);
  const size=new THREE.Vector3();   box.getSize(size);

  // Rhino is Z-up. After load with raw coords:
  //   size.x = width (feet), size.y = depth (feet), size.z = HEIGHT (feet)
  // We want height to go up in Three's Y axis.
  // Apply transform: threeX=rhinoX-cx, threeY=rhinoZ-minZ, threeZ=-(rhinoY-cy)
  blocks.forEach(b=>{
    const p=b.mesh.position;
    const rx=p.x-center.x;
    const ry=p.y-center.y;
    const rz=p.z;
    b.mesh.position.set(rx, rz-box.min.z, -ry);
    b.homePos.copy(b.mesh.position);
    b.targetPos.copy(b.mesh.position);
  });

  // Also transform all vertex positions in geometry
  blocks.forEach(b=>{
    const pa=b.mesh.geometry.attributes.position;
    for(let i=0;i<pa.count;i++){
      const rx=pa.getX(i)-center.x;
      const ry=pa.getY(i)-center.y;
      const rz=pa.getZ(i)-box.min.z;
      pa.setXYZ(i, rx, rz, -ry);
    }
    pa.needsUpdate=true;
    b.mesh.geometry.computeVertexNormals();
    b.mesh.geometry.computeBoundingBox();
    // Reset mesh position to 0 since verts now encode world pos
    b.mesh.position.set(0,0,0);
    b.homePos.set(0,0,0);
    b.targetPos.set(0,0,0);
  });

  // ── Now compute correct bbox after transform ──────────────────────────────
  const box2=new THREE.Box3();
  blocks.forEach(b=>box2.expandByObject(b.mesh));
  const center2=new THREE.Vector3(); box2.getCenter(center2);
  const size2=new THREE.Vector3();   box2.getSize(size2);

  // Shift so bottom sits on y=0, centred on x/z
  blocks.forEach(b=>{
    const pa=b.mesh.geometry.attributes.position;
    for(let i=0;i<pa.count;i++){
      pa.setXYZ(i,
        pa.getX(i)-center2.x,
        pa.getY(i)-box2.min.y,
        pa.getZ(i)-center2.z
      );
    }
    pa.needsUpdate=true;
    b.mesh.geometry.computeBoundingBox();
    // Store centroid of this block's geometry as homePos
    const bb=new THREE.Box3().setFromObject(b.mesh);
    const c=new THREE.Vector3(); bb.getCenter(c);
    b.homePos.copy(c);
    b.targetPos.copy(c);
    // mesh position stays at 0 — all position is baked into geometry
    // BUT we need to be able to move blocks, so let's unbake:
    // shift verts to be centred at origin, use mesh.position for placement
    for(let i=0;i<pa.count;i++){
      pa.setXYZ(i, pa.getX(i)-c.x, pa.getY(i)-c.y, pa.getZ(i)-c.z);
    }
    pa.needsUpdate=true;
    b.mesh.geometry.computeVertexNormals();
    b.mesh.position.copy(c);
    b.homePos.copy(c);
    b.targetPos.copy(c);
  });

  floor.position.y=0; grid.position.y=1;

  // Pre-compute explode offsets (fixed, not re-randomised)
  const H2=size2.y, D2=Math.max(size2.x,size2.z);
  const spread=D2*0.8;
  explodeOffsets=blocks.map((_,i)=>{
    const angle=(i/blocks.length)*Math.PI*2+(i%3)*0.4;
    const r=spread*(0.4+((i*7)%10)/10*0.8);
    return new THREE.Vector3(Math.cos(angle)*r, 0, Math.sin(angle)*r);
  });

  // Camera
  orb.r=D2*1.5+H2*0.5;
  orb.phi=0.72;
  orb.theta=0.55;
  orbTarget.set(0,H2*0.38,0);
  applyOrbit();

  const halfD=Math.max(D2,H2)*0.7;
  sun.shadow.camera.left=sun.shadow.camera.bottom=-halfD;
  sun.shadow.camera.right=sun.shadow.camera.top=halfD;
  sun.shadow.camera.updateProjectionMatrix();

  const el=document.getElementById('loading');
  el.style.opacity='0';
  setTimeout(()=>el.remove(),800);
}

loadAll();

// ── ORBIT ─────────────────────────────────────────────────────────────────────
const orb={theta:0.55,phi:0.72,r:500};
const orbTarget=new THREE.Vector3(0,80,0);

function applyOrbit(){
  camera.position.set(
    orbTarget.x+orb.r*Math.sin(orb.phi)*Math.sin(orb.theta),
    orbTarget.y+orb.r*Math.cos(orb.phi),
    orbTarget.z+orb.r*Math.sin(orb.phi)*Math.cos(orb.theta)
  );
  camera.lookAt(orbTarget);
}
applyOrbit();

// ── INTERACTION ──────────────────────────────────────────────────────────────
let isOrbiting=false, orbitStart={x:0,y:0}, orbitSnap={theta:0,phi:0};
let hoveredBlock=null, draggedBlock=null;
// Use a Y=constant horizontal plane for dragging — much more stable than camera-facing plane
const dragY=new THREE.Plane(new THREE.Vector3(0,1,0),0);
const dragHit=new THREE.Vector3();
const dragOff=new THREE.Vector3();
const raycaster=new THREE.Raycaster();
const mouse2d=new THREE.Vector2();
const cursorEl=document.getElementById('cursor');
const blockTag=document.getElementById('block-tag');

function setEmissive(block,v){
  if(block&&block.mesh.material) block.mesh.material.emissive.setScalar(v);
}

window.addEventListener('mousemove',e=>{
  cursorEl.style.left=e.clientX+'px';
  cursorEl.style.top=e.clientY+'px';
  mouse2d.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);

  if(draggedBlock){
    // drag on horizontal plane at block's Y height — no flying away
    dragY.constant=-draggedBlock.homePos.y;
    raycaster.setFromCamera(mouse2d,camera);
    if(raycaster.ray.intersectPlane(dragY,dragHit)){
      draggedBlock.targetPos.set(
        dragHit.x-dragOff.x,
        draggedBlock.homePos.y,   // lock Y — block stays at its height
        dragHit.z-dragOff.z
      );
    }
    return;
  }

  if(isOrbiting){
    orb.theta=orbitSnap.theta-(e.clientX-orbitStart.x)*0.007;
    orb.phi=Math.max(0.05,Math.min(1.45,orbitSnap.phi+(e.clientY-orbitStart.y)*0.007));
    applyOrbit();
    return;
  }

  // hover
  raycaster.setFromCamera(mouse2d,camera);
  const hits=raycaster.intersectObjects(blocks.map(b=>b.mesh));
  if(hits.length){
    const hit=blocks.find(b=>b.mesh===hits[0].object);
    if(!hit)return;
    if(hit!==hoveredBlock){
      setEmissive(hoveredBlock,0);
      hoveredBlock=hit;
      setEmissive(hit,0.12);
    }
    cursorEl.classList.add('hovering');
    blockTag.style.opacity='1';
    blockTag.style.left=(e.clientX+14)+'px';
    blockTag.style.top=(e.clientY-8)+'px';
    blockTag.textContent=currentMode==='explode'
      ?`Block ${hit.mesh.userData.idx} · drag to move`
      :`Block ${hit.mesh.userData.idx}`;
  } else {
    if(hoveredBlock){setEmissive(hoveredBlock,0);hoveredBlock=null;}
    cursorEl.classList.remove('hovering');
    blockTag.style.opacity='0';
  }
});

window.addEventListener('mousedown',e=>{
  if(e.button!==0)return;

  // explode mode + hovering a block = drag that block
  if(currentMode==='explode' && hoveredBlock){
    draggedBlock=hoveredBlock;
    setEmissive(draggedBlock,0);
    cursorEl.classList.add('grabbed');
    cursorEl.classList.remove('hovering');
    // compute XZ offset so block doesn't snap under cursor
    dragY.constant=-draggedBlock.mesh.position.y;
    raycaster.setFromCamera(mouse2d,camera);
    if(raycaster.ray.intersectPlane(dragY,dragHit)){
      dragOff.set(
        dragHit.x-draggedBlock.mesh.position.x,
        0,
        dragHit.z-draggedBlock.mesh.position.z
      );
    }
    return;
  }

  // pile mode, or explode mode not on a block = orbit
  isOrbiting=true;
  orbitStart={x:e.clientX,y:e.clientY};
  orbitSnap={theta:orb.theta,phi:orb.phi};
});

window.addEventListener('mouseup',()=>{
  if(draggedBlock){
    // update homePos so pile mode returns here, not original position
    draggedBlock.homePos.copy(draggedBlock.targetPos);
    draggedBlock=null;
    cursorEl.classList.remove('grabbed');
  }
  isOrbiting=false;
});

window.addEventListener('wheel',e=>{
  orb.r=Math.max(20,Math.min(3000,orb.r+e.deltaY*0.8));
  applyOrbit();
},{passive:true});

// ── MODE SWITCH ───────────────────────────────────────────────────────────────
function setMode(mode){
  currentMode=mode;
  document.getElementById('btn-pile').classList.toggle('active',mode==='pile');
  document.getElementById('btn-explode').classList.toggle('active',mode==='explode');

  if(mode==='pile'){
    blocks.forEach(b=>b.targetPos.copy(b.homePos));
    document.getElementById('hint').innerHTML='drag · orbit<br>scroll · zoom';
  } else {
    // Use pre-computed fixed offsets — no re-randomisation
    if(explodeOffsets){
      blocks.forEach((b,i)=>{
        b.targetPos.set(
          b.homePos.x+(explodeOffsets[i]?explodeOffsets[i].x:0),
          b.homePos.y,
          b.homePos.z+(explodeOffsets[i]?explodeOffsets[i].z:0)
        );
      });
    }
    document.getElementById('hint').innerHTML='click & drag blocks<br>scroll · zoom';
  }
}

// ── ANIMATION ─────────────────────────────────────────────────────────────────
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  clock.getDelta(); // consume delta
  blocks.forEach(b=>{
    const dist=b.mesh.position.distanceTo(b.targetPos);
    if(dist>0.5) b.mesh.position.lerp(b.targetPos,0.09);
    else b.mesh.position.copy(b.targetPos);
    b.mesh.scale.set(1,1,1);
  });
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>

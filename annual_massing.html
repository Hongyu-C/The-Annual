<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Annual — Massing</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#EDE8E2; overflow:hidden; font-family:'DM Sans',sans-serif; cursor:none; }
canvas { display:block; position:fixed; top:0; left:0; }
#cursor {
  position:fixed; width:12px; height:12px; background:#1a1a1a;
  border-radius:50%; pointer-events:none; z-index:1000;
  transform:translate(-50%,-50%);
  transition: width .18s, height .18s, background .18s;
}
#cursor.hovering { width:30px; height:30px; background:rgba(26,26,26,.08); border:1.5px solid #1a1a1a; }
#cursor.grabbed  { width:18px; height:18px; background:#E8635A; border:none; }
#nav {
  position:fixed; top:0; left:0; right:0; z-index:200;
  display:flex; align-items:center; justify-content:space-between;
  padding:24px 40px; pointer-events:none;
}
.nav-logo { pointer-events:auto; }
.nav-logo-sub { font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:#aaa; }
.nav-logo-main { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; color:#1a1a1a; margin-top:2px; }
.nav-links { pointer-events:auto; display:flex; gap:8px; }
.nav-link {
  background:rgba(255,255,255,.88); backdrop-filter:blur(8px);
  border:1px solid rgba(0,0,0,.08); padding:8px 18px;
  font-size:10px; font-weight:500; letter-spacing:.12em; text-transform:uppercase;
  color:#666; cursor:pointer; border-radius:100px; text-decoration:none; transition:all .2s;
}
.nav-link.active { background:#1a1a1a; color:#fff; border-color:#1a1a1a; }
.nav-link:hover:not(.active) { background:#fff; color:#1a1a1a; }
#mode-toggle {
  position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
  z-index:200; display:flex;
  background:rgba(255,255,255,.92); backdrop-filter:blur(12px);
  border:1px solid rgba(0,0,0,.08); border-radius:100px; padding:4px;
}
.mode-btn {
  padding:10px 28px; font-size:10px; font-weight:500;
  letter-spacing:.12em; text-transform:uppercase;
  color:#999; border:none; background:transparent; border-radius:100px;
  cursor:pointer; transition:all .3s;
}
.mode-btn.active { background:#1a1a1a; color:#fff; }
#hint {
  position:fixed; bottom:44px; right:40px; z-index:200;
  font-size:10px; letter-spacing:.15em; text-transform:uppercase;
  color:#bbb; text-align:right; line-height:1.9; pointer-events:none;
}
#loading {
  position:fixed; inset:0; background:#EDE8E2; z-index:500;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
  transition:opacity .8s ease;
}
.loading-title { font-family:'Syne',sans-serif; font-size:28px; font-weight:800; color:#1a1a1a; }
.loading-bar-wrap { width:180px; height:2px; background:rgba(0,0,0,.08); border-radius:2px; overflow:hidden; }
.loading-bar { height:100%; background:#E8635A; border-radius:2px; width:0%; transition:width .2s; }
.loading-count { font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:#aaa; }
#block-tag {
  position:fixed; z-index:300; background:#1a1a1a; color:#fff;
  font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  padding:5px 12px; border-radius:100px;
  pointer-events:none; opacity:0; transition:opacity .15s; white-space:nowrap;
}
</style>
</head>
<body>
<div id="cursor"></div>
<div id="loading">
  <div class="loading-title">The Annual</div>
  <div class="loading-bar-wrap"><div class="loading-bar" id="lbar"></div></div>
  <div class="loading-count" id="lcount">0 / 37</div>
</div>
<div id="nav">
  <div class="nav-logo">
    <div class="nav-logo-sub">The Annual</div>
    <div class="nav-logo-main">Massing</div>
  </div>
  <div class="nav-links">
    <a href="annual_program.html" class="nav-link">Program</a>
    <a href="annual_massing.html" class="nav-link active">Massing</a>
  </div>
</div>
<div id="mode-toggle">
  <button class="mode-btn active" id="btn-pile"    onclick="setMode('pile')">↳ Pile</button>
  <button class="mode-btn"        id="btn-explode" onclick="setMode('explode')">⊹ Blocks</button>
  <button class="mode-btn"        id="btn-reset"   onclick="resetAll()">↺ Reset</button>
</div>
<div id="hint">drag · orbit<br>scroll · zoom</div>
<div id="block-tag"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const TOTAL    = 37;
const BASE_URL = 'https://raw.githubusercontent.com/Hongyu-C/The-Annual/main/models/';
const PALETTE  = [0xE8635A,0xF2C94C,0x9B8EC4,0xF4A7B9,0x5BC8C8,0xA8D8A8,0xF7956E,0xB8D4E8];

// ── RENDERER ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xEDE8E2);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,5000);

// ── LIGHTS ────────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff,1.0));
const sun=new THREE.DirectionalLight(0xfff5e8,0.8);
sun.position.set(200,400,250);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=10; sun.shadow.camera.far=3000;
sun.shadow.camera.left=sun.shadow.camera.bottom=-600;
sun.shadow.camera.right=sun.shadow.camera.top=600;
sun.shadow.bias=-0.0005;
scene.add(sun);
const fill=new THREE.DirectionalLight(0xddeeff,0.3);
fill.position.set(-150,100,-200);
scene.add(fill);

// ── FLOOR ─────────────────────────────────────────────────────────────────────
const floorMesh=new THREE.Mesh(
  new THREE.PlaneGeometry(5000,5000),
  new THREE.ShadowMaterial({opacity:0.04})
);
floorMesh.rotation.x=-Math.PI/2;
floorMesh.receiveShadow=true;
scene.add(floorMesh);
const grid=new THREE.GridHelper(2000,80,0xcccccc,0xdddddd);
grid.material.opacity=0.18; grid.material.transparent=true;
scene.add(grid);

// ── OBJ PARSER ────────────────────────────────────────────────────────────────
// Each OBJ is parsed with vertices kept in LOCAL space (centred at origin).
// The block's WORLD position (from Rhino) is extracted separately as centroid,
// and stored in mesh.position. This way mesh.position is always meaningful.
//
// Rhino exports with Z-up. We want Y-up (Three.js convention):
//   threeX =  rhinoX
//   threeY =  rhinoZ   (Rhino's Z becomes Three's Y)
//   threeZ = -rhinoY   (Rhino's Y becomes Three's -Z)

function parseOBJ(text){
  // Step 1: collect raw Rhino vertices (Z-up)
  const rhinoV=[];
  const lines=text.split('\n');
  for(const raw of lines){
    const p=raw.trim().split(/\s+/);
    if(p[0]==='v') rhinoV.push(+p[1],+p[2],+p[3]);
  }

  // Step 2: compute centroid in Three-space (after axis swap)
  let cx=0,cy=0,cz=0;
  const n=rhinoV.length/3;
  for(let i=0;i<n;i++){
    cx+=rhinoV[i*3];
    cy+=rhinoV[i*3+1];  // rhinoY is already height
    cz+=rhinoV[i*3+2];
  }
  cx/=n; cy/=n; cz/=n;
  const centroid=new THREE.Vector3(cx,cy,cz);

  // Step 3: build geometry with vertices centred at origin
  const rhinoN=[];
  const pos=[],nrm=[];
  for(const raw of lines){
    const p=raw.trim().split(/\s+/);
    if(p[0]==='vn') rhinoN.push(+p[1],+p[2],+p[3]);
  }
  for(const raw of lines){
    const p=raw.trim().split(/\s+/);
    if(p[0]!=='f') continue;
    const cs=p.slice(1).map(t=>{
      const s=t.split('/');
      return{vi:(+s[0])-1, ni:s.length>=3&&s[2]!==''?(+s[2])-1:(+s[0])-1};
    });
    for(let i=1;i<cs.length-1;i++){
      for(const c of[cs[0],cs[i],cs[i+1]]){
        const vi=c.vi;
        // axis swap + subtract centroid → local coords
        pos.push(
          rhinoV[vi*3  ]-cx,
          rhinoV[vi*3+1]-cy,
          rhinoV[vi*3+2]-cz
        );
        if(rhinoN.length){
          const ni=c.ni;
          nrm.push(rhinoN[ni*3], rhinoN[ni*3+1], rhinoN[ni*3+2]);
        }
      }
    }
  }

  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  if(nrm.length) geo.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(nrm),3));
  else geo.computeVertexNormals();

  return {geo, centroid};
}

// ── BLOCK STORE ───────────────────────────────────────────────────────────────
const blocks=[];
let currentMode='pile';
let explodeOffsets=null; // pre-computed, fixed per block

// ── LOAD ──────────────────────────────────────────────────────────────────────
let loaded=0;
const lbar=document.getElementById('lbar');
const lcount=document.getElementById('lcount');

async function loadAll(){
  const promises=[];
  for(let i=1;i<=TOTAL;i++){
    const idx=String(i).padStart(2,'0');
    promises.push(
      fetch(`${BASE_URL}Object_${idx}.obj`)
        .then(r=>{if(!r.ok)throw r.status; return r.text();})
        .then(text=>{
          const {geo,centroid}=parseOBJ(text);
          const mat=new THREE.MeshStandardMaterial({
            color:PALETTE[(i-1)%PALETTE.length],
            roughness:0.5, metalness:0.05,
          });
          const mesh=new THREE.Mesh(geo,mat);
          mesh.castShadow=mesh.receiveShadow=true;
          mesh.userData.idx=i;
          // Place mesh at Rhino world centroid (already axis-swapped)
          mesh.position.copy(centroid);
          scene.add(mesh);
          blocks.push({
            mesh,
            homePos: centroid.clone(),      // current pile rest position
            originalPos: centroid.clone(),  // NEVER changes — used for explode base
            targetPos: centroid.clone(),
          });
        })
        .catch(e=>console.warn(`Object_${idx}.obj:`,e))
        .finally(()=>{
          loaded++;
          lbar.style.width=Math.round(loaded/TOTAL*100)+'%';
          lcount.textContent=`${loaded} / ${TOTAL}`;
        })
    );
  }
  await Promise.all(promises);
  onAllLoaded();
}

function onAllLoaded(){
  if(!blocks.length){console.error('no blocks'); return;}

  // Compute bounding box of all block centroids
  const box=new THREE.Box3();
  blocks.forEach(b=>box.expandByPoint(b.homePos));
  const center=new THREE.Vector3(); box.getCenter(center);
  const size=new THREE.Vector3();   box.getSize(size);

  // Shift so massing is centred at X=0,Z=0 and bottom sits at Y=0
  const shiftX=center.x, shiftY=box.min.y, shiftZ=center.z;
  blocks.forEach(b=>{
    b.mesh.position.x -= shiftX;
    b.mesh.position.y -= shiftY;
    b.mesh.position.z -= shiftZ;
    b.homePos.copy(b.mesh.position);
    b.originalPos.copy(b.mesh.position);
    b.targetPos.copy(b.mesh.position);
    // physics state
    b.vel     = new THREE.Vector3();
    b.falling = false;
    b.floorY  = b.mesh.position.y; // blocks rest at their own pile height
  });

  floorMesh.position.y=0;
  grid.position.y=1;

  // Pre-compute fixed explode offsets (deterministic, not random)
  const D=Math.max(size.x,size.z);
  const spread=D*0.4;  // tighter spread — mm units so D is already large
  explodeOffsets=blocks.map((_,i)=>{
    const angle=(i/blocks.length)*Math.PI*2 + (i%5)*0.3;
    const r=spread*(0.2 + (i%7)/7*0.5);
    return {dx: Math.cos(angle)*r, dz: Math.sin(angle)*r};
  });

  // Fit camera
  const H=size.y;
  orb.r   = D*1.4+H*0.5;
  orb.phi = 0.72;
  orb.theta=0.55;
  orbTarget.set(0, H*0.38, 0);
  applyOrbit();

  document.getElementById('loading').style.opacity='0';
  setTimeout(()=>document.getElementById('loading').remove(),800);
}

loadAll();

// ── ORBIT ─────────────────────────────────────────────────────────────────────
const orb={theta:0.55, phi:0.72, r:500};
const orbTarget=new THREE.Vector3(0,80,0);

function applyOrbit(){
  camera.position.set(
    orbTarget.x + orb.r*Math.sin(orb.phi)*Math.sin(orb.theta),
    orbTarget.y + orb.r*Math.cos(orb.phi),
    orbTarget.z + orb.r*Math.sin(orb.phi)*Math.cos(orb.theta)
  );
  camera.lookAt(orbTarget);
}
applyOrbit();

// ── INTERACTION ───────────────────────────────────────────────────────────────
let isOrbiting=false, orbitStart={x:0,y:0}, orbitSnap={theta:0,phi:0};
let hoveredBlock=null, draggedBlock=null;
const dragPlaneH=new THREE.Plane(new THREE.Vector3(0,1,0),0); // horizontal drag plane
const dragHit=new THREE.Vector3();
const dragOffXZ={x:0,z:0};
const raycaster=new THREE.Raycaster();
const mouse2d=new THREE.Vector2();
const cursorEl=document.getElementById('cursor');
const blockTag=document.getElementById('block-tag');

function setEmissive(b,v){ if(b) b.mesh.material.emissive.setScalar(v); }

window.addEventListener('mousemove',e=>{
  cursorEl.style.left=e.clientX+'px';
  cursorEl.style.top=e.clientY+'px';
  mouse2d.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);

  if(draggedBlock){
    dragPlaneH.set(new THREE.Vector3(0,1,0), -draggedBlock.mesh.position.y);
    raycaster.setFromCamera(mouse2d,camera);
    if(raycaster.ray.intersectPlane(dragPlaneH,dragHit)){
      draggedBlock.vel.set(0,0,0);
      draggedBlock.targetPos.set(
        dragHit.x-dragOffXZ.x,
        draggedBlock.mesh.position.y,
        dragHit.z-dragOffXZ.z
      );
      console.log('dragging | targetPos:',draggedBlock.targetPos.toArray(),'| meshPos:',draggedBlock.mesh.position.toArray());
    }
    return;
  }

  if(isOrbiting){
    orb.theta=orbitSnap.theta-(e.clientX-orbitStart.x)*0.007;
    orb.phi=Math.max(0.05,Math.min(1.45,orbitSnap.phi+(e.clientY-orbitStart.y)*0.007));
    applyOrbit();
    return;
  }

  // hover detection
  raycaster.setFromCamera(mouse2d,camera);
  const hits=raycaster.intersectObjects(blocks.map(b=>b.mesh));
  if(hits.length){
    const hit=blocks.find(b=>b.mesh===hits[0].object);
    if(!hit) return;
    if(hit!==hoveredBlock){
      setEmissive(hoveredBlock,0);
      hoveredBlock=hit;
      setEmissive(hit,0.12);
    }
    cursorEl.classList.add('hovering');
    blockTag.style.opacity='1';
    blockTag.style.left=(e.clientX+14)+'px';
    blockTag.style.top=(e.clientY-8)+'px';
    blockTag.textContent=currentMode==='explode'
      ?`Block ${hit.mesh.userData.idx} · drag to move`
      :`Block ${hit.mesh.userData.idx}`;
  } else {
    if(hoveredBlock){setEmissive(hoveredBlock,0);hoveredBlock=null;}
    cursorEl.classList.remove('hovering');
    blockTag.style.opacity='0';
  }
});

window.addEventListener('mousedown',e=>{
  if(e.button!==0) return;
  if(currentMode==='explode' && hoveredBlock){
    draggedBlock=hoveredBlock;
    setEmissive(draggedBlock,0);
    cursorEl.classList.add('grabbed');
    cursorEl.classList.remove('hovering');
    const blockY=draggedBlock.mesh.position.y;
    dragPlaneH.set(new THREE.Vector3(0,1,0), -blockY);
    raycaster.setFromCamera(mouse2d,camera);
    const hit=raycaster.ray.intersectPlane(dragPlaneH,dragHit);
    console.log('drag start | blockY:',blockY,'| planeHit:',hit,'| dragHit:',dragHit.toArray());
    if(hit){
      dragOffXZ.x=dragHit.x-draggedBlock.mesh.position.x;
      dragOffXZ.z=dragHit.z-draggedBlock.mesh.position.z;
    } else {
      dragOffXZ.x=0; dragOffXZ.z=0;
    }
    return;
  }
  console.log('mousedown | mode:',currentMode,'| hoveredBlock:',hoveredBlock);
  isOrbiting=true;
  orbitStart={x:e.clientX,y:e.clientY};
  orbitSnap={theta:orb.theta,phi:orb.phi};
});

window.addEventListener('mouseup',()=>{
  if(draggedBlock){
    // release: trigger gravity drop
    draggedBlock.falling=true;
    draggedBlock.vel.set(0,0,0);
    draggedBlock.homePos.copy(draggedBlock.targetPos);
    draggedBlock=null;
    cursorEl.classList.remove('grabbed');
  }
  isOrbiting=false;
});

window.addEventListener('wheel',e=>{
  orb.r=Math.max(20,Math.min(3000,orb.r+e.deltaY*0.8));
  applyOrbit();
},{passive:true});

// ── MODE SWITCH ───────────────────────────────────────────────────────────────
function setMode(mode){
  currentMode=mode;
  document.getElementById('btn-pile').classList.toggle('active',mode==='pile');
  document.getElementById('btn-explode').classList.toggle('active',mode==='explode');
  if(mode==='pile'){
    // smooth return to pile positions, reset physics
    blocks.forEach(b=>{
      b.targetPos.copy(b.homePos);
      b.falling=false;
      b.vel.set(0,0,0);
    });
    document.getElementById('hint').innerHTML='drag · orbit<br>scroll · zoom';
  } else {
    // block mode: stay in pile position, enable drag + physics
    // do NOT move blocks — they start where they are
    blocks.forEach(b=>{
      b.targetPos.copy(b.mesh.position);
      b.falling=false;
      b.vel.set(0,0,0);
    });
    document.getElementById('hint').innerHTML='click & drag blocks<br>scroll · zoom';
  }
}

// ── RESET ─────────────────────────────────────────────────────────────────────
function resetAll(){
  blocks.forEach(b=>{
    b.homePos.copy(b.originalPos);
    b.targetPos.copy(b.originalPos);
    b.falling=false;
    b.vel.set(0,0,0);
  });
  setMode('pile');
}

// ── ANIMATION + PHYSICS ───────────────────────────────────────────────────────
// Lightweight gravity: when a block is released (falling=true),
// apply gravity to vel.y, bounce when hitting floor (y=0+blockHalfHeight).
// No block-block collision — just floor bounce.
const GRAVITY    = -2800;   // mm/s² (scaled for mm units)
const BOUNCE     = 0.38;    // restitution
const DRAG_XZ    = 0.88;    // horizontal damping per frame
const SNAP_DIST  = 2;       // mm — snap threshold

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);

  blocks.forEach(b=>{
    if(b===draggedBlock) return; // skip physics while dragging

    if(currentMode==='explode' && b.falling){
      // apply gravity
      b.vel.y+=GRAVITY*dt;
      b.vel.x*=DRAG_XZ;
      b.vel.z*=DRAG_XZ;

      b.mesh.position.x+=b.vel.x*dt;
      b.mesh.position.y+=b.vel.y*dt;
      b.mesh.position.z+=b.vel.z*dt;

      // floor collision at block's rest Y
      if(b.mesh.position.y<=b.floorY){
        b.mesh.position.y=b.floorY;
        b.vel.y*=-BOUNCE;
        b.vel.x*=0.7;
        b.vel.z*=0.7;
        // stop bouncing if tiny
        if(Math.abs(b.vel.y)<5){
          b.vel.set(0,0,0);
          b.falling=false;
          b.homePos.copy(b.mesh.position);
          b.targetPos.copy(b.mesh.position);
        }
      }

      // sync targetPos
      b.targetPos.copy(b.mesh.position);
    } else {
      // smooth lerp toward target
      const d=b.mesh.position.distanceTo(b.targetPos);
      if(d>SNAP_DIST) b.mesh.position.lerp(b.targetPos,0.09);
      else            b.mesh.position.copy(b.targetPos);
    }
  });

  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
